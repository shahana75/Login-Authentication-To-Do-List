<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - SHAZAM</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: radial-gradient(circle at 50% 50%, #0d1b2a, #020813);
      font-family: 'Plus Jakarta Sans', sans-serif;
      letter-spacing: 0.5px;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background-color: rgba(4, 12, 27, 0.7);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      text-align: center;
      padding: 20px;
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 2px;
      font-family: 'Playfair Display', serif;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      color: #ffffff;
    }

    .content-wrapper {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .content-title {
      color: #ffffff;
      font-family: 'Playfair Display', serif;
      letter-spacing: 1px;
      text-align: center;
      margin-bottom: 30px;
      font-size: 1.4rem;
      font-weight: 500;
    }

    .container {
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      width: 100%;
      max-width: 420px;
      padding: 40px 30px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      gap: 20px;
      transition: border-color 0.3s ease;
    }

    .container:hover {
      border-color: rgba(255, 255, 255, 0.12);
    }

    .container h3 {
      font-family: 'Playfair Display', serif;
      font-size: 1.3rem;
      font-weight: 600;
      color: #ffffff;
      text-align: center;
      margin-bottom: 10px;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: rgba(255, 255, 255, 0.05);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 0.95rem;
      transition: all 0.3s ease;
    }

    input[type="text"]:focus,
    input[type="password"]:focus {
      outline: none;
      border-color: #38bdf8;
      background: rgba(255, 255, 255, 0.08);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.25);
    }

    button[type="submit"] {
      width: 100%;
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: linear-gradient(135deg, #0284c7, #0369a1);
      color: #ffffff;
      padding: 12px;
      border-radius: 8px;
      border: none;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(3, 105, 161, 0.2);
      transition: all 0.3s ease;
      margin-top: 10px;
    }

    button[type="submit"]:hover {
      background: linear-gradient(135deg, #0369a1, #075985);
      box-shadow: 0 6px 16px rgba(3, 105, 161, 0.3);
      transform: translateY(-1px);
    }

    button[type="submit"]:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .error {
      color: #fca5a5;
      text-align: center;
      min-height: 20px;
      font-size: 0.9rem;
      font-weight: 500;
    }

    footer {
      background-color: #020813;
      text-align: center;
      padding: 24px;
      font-size: 0.85rem;
      color: #64748b;
      border-top: 1px solid rgba(255, 255, 255, 0.03);
    }
  </style>
</head>
<body>
  <header>SHAZAM</header>

  <div class="content-wrapper">
    <div class="content-title">
      LOG-IN Into Your Account To Get Started!
    </div>

    <div class="container">
      <h3>Enter Your Name and Password</h3>
      <input type="text" id="nameInput" placeholder="Enter your name">
      <input type="password" id="passwordInput" placeholder="Password">
      <button type="submit" id="submit">Submit</button>
      <p id="errorMsg" class="error"></p>
    </div>
  </div>

  <footer>created by Shahana</footer>

  <script>
    const nameInput = document.getElementById("nameInput");
    const passwordInput = document.getElementById("passwordInput");
    const submitBtn = document.getElementById("submit");
    const errorMsg = document.getElementById("errorMsg");

    async function handleLogin() {
      errorMsg.textContent = "";
      const username = nameInput.value.trim();
      const password = passwordInput.value;

      if (!username || !password) {
        errorMsg.textContent = "Please enter your name and password.";
        return;
      }

      submitBtn.disabled = true;

      try {
        const response = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (response.ok) {
          window.location.href = data.redirect;
        } else {
          errorMsg.textContent = data.error || "Login failed.";
        }
      } catch (err) {
        errorMsg.textContent = "Could not reach the server.";
      } finally {
        submitBtn.disabled = false;
      }
    }

    submitBtn.addEventListener("click", handleLogin);
    passwordInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") handleLogin();
    });
  </script>
</body>
</html>
